<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>打工人工作台 · UI 方案 v0.1</title>
<link rel="icon" href="data:," />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="src/styles.css" />
</head>
<body>
<div class="app" id="app">

  <!-- ============ 一级导航 ============ -->
  <aside class="rail" aria-label="一级导航">
    <div class="rail__logo" title="打工人工作台">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5 12 5l8 4.5"/><path d="M6 11v7h12v-7"/><path d="M10 18v-4h4v4"/></svg>
    </div>
    <nav class="rail__nav" id="railNav"><!-- JS 渲染 --></nav>
    <div class="rail__spacer"></div>
    <div class="rail__foot">
      <button class="rail__item" id="railSettings" aria-label="全局设置">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg>
        <span class="rail__lbl">设置</span>
      </button>
    </div>
  </aside>

  <!-- ============ 主区域 ============ -->
  <main class="main">
    <!-- 全局搜索：跨模块常驻 -->
    <div class="searchbar">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <label for="globalSearch" class="sr-only">全局搜索</label>
        <input id="globalSearch" type="search" placeholder="搜索待办、资讯、外卖券…" autocomplete="off" />
        <span class="kbd">⌘K</span>
      </div>
    </div>

    <header class="topbar">
      <div class="page-head">
        <div class="panel__kicker" id="panelKicker">Overview</div>
        <h1 class="panel__title" id="panelTitle">我的今日</h1>
        <p class="panel__desc" id="panelDesc">今天还剩多少能自由支配的时间</p>
      </div>
      <div class="topbar__actions">
        <button class="btn btn--icon" id="btnHelp" aria-label="帮助与快捷键" title="帮助">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 4.8.9c0 1.6-2.3 2.1-2.3 3.6"/><path d="M12 17.2v.1"/></svg>
        </button>
        <span class="icon-btn-wrap">
          <button class="btn btn--icon" id="btnBell" aria-label="通知，3 条未读"><span class="dot"></span>
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 8-3 8h18s-3-1-3-8"/><path d="M10.3 21a2 2 0 0 0 3.4 0"/></svg>
          </button>
        </span>
        <button class="avatar-btn" id="btnAccount" aria-label="账户与设置">
          <span class="avatar">林</span>
          <span class="who"><b>林小满</b><span>产品经理</span></span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="var(--ink-3)" stroke-width="1.9" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>
    </header>

    <!-- 二级导航：分段式按钮，滑块跟随选中项移动 -->
    <div class="navrow">
      <div class="seg-nav" id="segNav" role="tablist" aria-label="当前模块视图（数字键 1~9 切换）">
        <span class="seg-nav__thumb" aria-hidden="true"></span>
      </div>
      <button class="btn btn--ghost btn--sm navrow__new" data-action="new-task">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建待办
      </button>
    </div>

    <div class="stage" id="stage"><!-- 视图由 JS 渲染 --></div>
  </main>
</div>

<!-- Toast -->
<div class="toasts" id="toasts" role="status" aria-live="polite" aria-atomic="false"></div>

<!-- 全局设置浮层 -->
<div class="sheet-mask" id="sheetMask" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="sheet__head">
      <div>
        <h3 id="sheetTitle">设置</h3>
        <p>全局生效，切换模块不会丢失</p>
      </div>
      <button class="btn btn--icon" id="sheetClose" aria-label="关闭设置" style="width:34px;height:34px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="sheetBody"></div>
  </div>
</div>

<script type="module" src="src/app.js"></script>
</body>
</html>
